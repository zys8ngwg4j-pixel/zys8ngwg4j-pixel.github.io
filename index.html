<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hit The Roman</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hit The Roman">
    <link rel="apple-touch-icon" href="buddy_head.png">
    <meta name="theme-color" content="#000000">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: 'Courier New', monospace;
            touch-action: manipulation; user-select: none;
            -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) { body { cursor: none; } }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #hud {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 10; pointer-events: none;
        }
        #coins-display { color: #fff; font-size: 16px; letter-spacing: 2px; }
        #ult-info { color: #aaa; font-size: 10px; text-align: right; }

        #btn-shop {
            position: fixed; bottom: 90px; right: 15px;
            padding: 12px 18px; background: rgba(30,30,30,0.9);
            border: 2px solid #666; color: #fff;
            font-family: 'Courier New', monospace; font-size: 13px;
            text-transform: uppercase; letter-spacing: 2px;
            z-index: 10; cursor: pointer;
        }
        #btn-ult {
            position: fixed; bottom: 90px; left: 15px;
            padding: 12px 18px; background: rgba(30,30,30,0.9);
            border: 2px solid #a55; color: #f88;
            font-family: 'Courier New', monospace; font-size: 13px;
            text-transform: uppercase; letter-spacing: 2px;
            z-index: 10; cursor: pointer; display: none;
        }

        #inventory {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
        }
        .inv-slot {
            width: 50px; height: 50px;
            background: rgba(20,20,20,0.8); border: 2px solid #444;
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .inv-slot:active { border-color: #aaa; background: rgba(40,40,40,0.9); }
        .inv-slot img { width: 40px; height: 40px; object-fit: contain; pointer-events: none; }
        .inv-slot.empty { opacity: 0.4; cursor: default; }
        .inv-slot.used { opacity: 0.5; border-color: #555; }
        .inv-slot.equipped { border-color: #ff0; box-shadow: 0 0 8px rgba(255,255,0,0.4); }

        #shop-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 100;
            display: none; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 30px 15px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        #shop-overlay.open { display: flex; }
        .shop-title { color: #fff; font-size: 20px; letter-spacing: 3px; margin-bottom: 20px; }
        .shop-close {
            position: fixed; top: 15px; right: 20px;
            color: #fff; font-size: 28px; cursor: pointer; z-index: 101;
        }
        .shop-close:active { color: #ccc; }

        .shop-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%; max-width: 360px; padding: 12px;
            border: 1px solid #333; border-radius: 10px;
            margin-bottom: 10px; background: rgba(20,20,20,0.8);
        }
        .shop-item img { width: 48px; height: 48px; object-fit: contain; pointer-events: none; }
        .shop-item .info { flex: 1; }
        .shop-item .name { color: #fff; font-size: 15px; letter-spacing: 1px; }
        .shop-item .stats { color: #ccc; font-size: 11px; margin-top: 2px; }
        .shop-item .btn {
            padding: 12px 16px; background: rgba(30,30,30,0.9);
            border: 1px solid #666; color: #fff;
            font-family: 'Courier New', monospace; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; white-space: nowrap;
        }
        .shop-item .btn:active { background: rgba(255,255,255,0.15); }
        .shop-item .btn.disabled { opacity: 0.3; pointer-events: none; }
        .shop-item.locked { opacity: 0.4; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div id="coins-display">💰 0</div>
        <div id="ult-info"></div>
    </div>

    <div id="btn-ult">УЛЬТ</div>
    <div id="btn-shop">Магазин</div>
    <div id="inventory"></div>

    <div id="shop-overlay">
        <span class="shop-close" id="close-shop">✕</span>
        <div class="shop-title">МАГАЗИН</div>
        <div id="shop-items"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        const $ = id => document.getElementById(id);
        const canvas = $('game-canvas'), ctx = canvas.getContext('2d');

        const { Engine, World, Bodies, Body, Events, Mouse, MouseConstraint, Composite } = Matter;
        const engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
        const world = engine.world;

        const RADIUS = 55, WALL_SIZE = 80;
        let W, H, floor, leftWall, rightWall, ceiling;

        function createWalls() {
            [floor, leftWall, rightWall, ceiling].forEach(w => { if (w) World.remove(world, w); });
            floor = Bodies.rectangle(W/2, H+WALL_SIZE/2, W+WALL_SIZE*2, WALL_SIZE, { isStatic:true, friction:1, restitution:0.1, label:'floor' });
            leftWall = Bodies.rectangle(-WALL_SIZE/2, H/2, WALL_SIZE, H+WALL_SIZE*2, { isStatic:true, friction:1, restitution:0.1, label:'wall' });
            rightWall = Bodies.rectangle(W+WALL_SIZE/2, H/2, WALL_SIZE, H+WALL_SIZE*2, { isStatic:true, friction:1, restitution:0.1, label:'wall' });
            ceiling = Bodies.rectangle(W/2, -WALL_SIZE/2, W+WALL_SIZE*2, WALL_SIZE, { isStatic:true, friction:1, restitution:0.1, label:'ceiling' });
            World.add(world, [floor, leftWall, rightWall, ceiling]);
        }

        const head = Bodies.circle(0, 0, RADIUS, { restitution:0.2, friction:0.6, density:0.004, label:'head' });
        World.add(world, [head]);

        const mouse = Mouse.create(canvas);
        if (mouse.element) { mouse.element.removeEventListener('mousewheel', mouse.mousewheel); mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel); }
        const mouseConstraint = MouseConstraint.create(engine, { mouse, constraint:{ stiffness:0.05, damping:0.03, render:{ visible:false } } });
        World.add(world, mouseConstraint);
        document.addEventListener('mousemove', e => {
            mouse.position.x = Math.max(RADIUS, Math.min(W-RADIUS, e.clientX));
            mouse.position.y = Math.max(RADIUS, Math.min(H-RADIUS-10, e.clientY));
        });

        function loadImg(src) { var img = new Image(); img.src = src; return img; }
        const bgImg = loadImg('bg_lab.png');
        const faceNormal = loadImg('buddy_head.png');
        const faceHurt = loadImg('buddy_head_hurt.png');
        const weaponImgs = {
            bat: loadImg('weapon_bat.png'), sword: loadImg('weapon_sword.png'),
            bita: loadImg('weapon_bita.png'), shocker: loadImg('weapon_shocker.png'),
            acid: loadImg('weapon_acid.png'), shuriken: loadImg('weapon_shuriken.png'),
            laser_sword: loadImg('weapon_laser_sword.png')
        };

        const weaponData = {
            bat: { name:'Булава', cost:50, reward:20, requires:null, branch:null, ultName:'Землетрясение', ultDesc:'5 подскоков' },
            sword: { name:'Меч', cost:670, reward:67, requires:'bat', branch:'right', ultName:'Удар', ultDesc:'+500 сразу' },
            bita: { name:'Бита', cost:670, reward:67, requires:'bat', branch:'left', ultName:'Хоум-ран', ultDesc:'+300 в стену' },
            shocker: { name:'Электрошокер', cost:1600, reward:260, requires:'sword', branch:'right', ultName:'Разряд', ultDesc:'+50/сек 10с' },
            acid: { name:'Кислота', cost:1600, reward:260, requires:'sword', branch:'left', ultName:'Облако', ultDesc:'+500/5сек 15с' },
            shuriken: { name:'Сюрикены', cost:1600, reward:260, requires:'bita', branch:'right', ultName:'Шквал', ultDesc:'Тап 15с +260' },
            laser_sword: { name:'Лазерный меч', cost:1600, reward:260, requires:'bita', branch:'left', ultName:'Луч', ultDesc:'+200/сек 5с' },
            unlock: { name:'Разблокировка утерянного', cost:67767, reward:0, requires:null, branch:null, isUnlock:true }
        };

        // Состояние
        let coins = 0, purchases = {}, unlockedLost = false, blockedBranch = null;
        let isHurt = false, hurtTimerId = null;
        let equippedWeapon = null;
        let ultReady = true, ultCooldown = 60000, ultActive = false, ultTimer = null, ultTicks = [];
        let acidCloud = null, acidCloudTimer = null;

        // Сохранение
        function saveGame() {
            localStorage.setItem('hitroman_coins', coins);
            localStorage.setItem('hitroman_purchases', JSON.stringify(purchases));
            localStorage.setItem('hitroman_unlockedLost', unlockedLost);
            localStorage.setItem('hitroman_blockedBranch', blockedBranch);
        }
        function loadGame() {
            coins = parseInt(localStorage.getItem('hitroman_coins')) || 0;
            purchases = JSON.parse(localStorage.getItem('hitroman_purchases')) || {};
            unlockedLost = localStorage.getItem('hitroman_unlockedLost') === 'true';
            blockedBranch = localStorage.getItem('hitroman_blockedBranch') || null;
            if (blockedBranch === 'null') blockedBranch = null;
        }
        loadGame();
        window.addEventListener('beforeunload', saveGame);
        setInterval(saveGame, 3000);

        function showHurt() { isHurt = true; if (hurtTimerId) clearTimeout(hurtTimerId); hurtTimerId = setTimeout(() => { isHurt = false; }, 1500); }
        function addCoins(amount) { coins += amount; $('coins-display').textContent = '💰 ' + coins; saveGame(); }

        let weaponSpawned = {};
        function renderInventory() {
            var inv = $('inventory'); inv.innerHTML = '';
            var owned = Object.keys(purchases).filter(k => purchases[k] && weaponData[k] && !weaponData[k].isUnlock);
            for (var i = 0; i < 7; i++) {
                var slot = document.createElement('div'); slot.className = 'inv-slot';
                if (i < owned.length) {
                    var wKey = owned[i], w = weaponData[wKey];
                    var img = document.createElement('img'); img.src = weaponImgs[wKey].src; img.draggable = false;
                    slot.appendChild(img);
                    if (equippedWeapon === wKey) slot.classList.add('equipped');
                    slot.addEventListener('click', (function(key) { return function(e) { e.stopPropagation(); equipWeapon(key); }; })(wKey));
                } else slot.classList.add('empty');
                inv.appendChild(slot);
            }
        }

        function equipWeapon(wKey) {
            if (equippedWeapon === wKey) { equippedWeapon = null; $('btn-ult').style.display = 'none'; }
            else {
                equippedWeapon = wKey;
                if (['bat','sword','bita','shocker','acid','laser_sword'].includes(wKey)) {
                    weaponSpawned[wKey] = false;
                }
                $('btn-ult').style.display = 'block';
                updateUltButton();
            }
            renderInventory();
        }

        function updateUltButton() {
            if (!ultReady) { $('btn-ult').textContent = 'Перезарядка...'; $('btn-ult').style.opacity = '0.5'; }
            else { $('btn-ult').textContent = equippedWeapon ? 'УЛЬТ: '+weaponData[equippedWeapon].ultName : 'УЛЬТ'; $('btn-ult').style.opacity = '1'; }
        }

        function spawnWeaponBody(wKey) {
            if (weaponSpawned[wKey]) return;
            weaponSpawned[wKey] = true;
            World.add(world, [Bodies.rectangle(W/2+(Math.random()-0.5)*100, 60, 60, 60, {
                restitution:0.3, friction:0.4, density:0.003, label:'weapon', weaponKey:wKey, reward:weaponData[wKey].reward
            })]);
        }

        // Ульта
        function activateUlt() {
            if (!ultReady || !equippedWeapon || ultActive) return;
            ultReady = false; ultActive = true;
            $('btn-ult').textContent = 'Активна...'; $('btn-ult').style.opacity = '0.7';

            switch(equippedWeapon) {
                case 'bat':
                    for (let i = 0; i < 5; i++) setTimeout(() => { Body.setVelocity(head, { x:(Math.random()-0.5)*5, y:-10 }); addCoins(100); showHurt(); }, i*600);
                    setTimeout(endUlt, 3500);
                    break;
                case 'sword':
                    addCoins(500); showHurt();
                    Body.setVelocity(head, { x:0, y:-15 });
                    setTimeout(endUlt, 1000);
                    break;
                case 'bita':
                    addCoins(300); showHurt();
                    Body.setVelocity(head, { x:(Math.random()>0.5?15:-15), y:-12 });
                    setTimeout(endUlt, 1000);
                    break;
                case 'shocker':
                    for (let i = 0; i < 10; i++) setTimeout(() => { addCoins(50); showHurt(); Body.setVelocity(head, { x:(Math.random()-0.5)*6, y:(Math.random()-0.5)*4 }); }, i*1000);
                    setTimeout(endUlt, 10500);
                    break;
                case 'acid':
                    acidCloud = { alpha: 0.7 };
                    acidCloudTimer = setInterval(() => { addCoins(500); showHurt(); }, 5000);
                    setTimeout(() => { clearInterval(acidCloudTimer); acidCloud = { alpha: 0.3 }; setTimeout(() => { acidCloud = null; }, 3000); endUlt(); }, 15000);
                    break;
                case 'shuriken':
                    $('btn-ult').textContent = 'Тапай!';
                    setTimeout(endUlt, 15000);
                    break;
                case 'laser_sword':
                    for (let i = 0; i < 5; i++) setTimeout(() => { addCoins(200); showHurt(); }, i*1000);
                    setTimeout(endUlt, 5500);
                    break;
            }
        }

        function endUlt() {
            ultActive = false; $('btn-ult').style.opacity = '0.5'; $('btn-ult').textContent = 'Перезарядка...';
            setTimeout(() => { ultReady = true; updateUltButton(); }, ultCooldown);
            if (acidCloudTimer) { clearInterval(acidCloudTimer); acidCloudTimer = null; }
            if (acidCloud) { acidCloud = { alpha: 0.1 }; setTimeout(() => { acidCloud = null; }, 3000); }
        }

        $('btn-ult').addEventListener('click', activateUlt);

        // Столкновения
        Events.on(engine, 'collisionStart', function(event) {
            for (var i = 0; i < event.pairs.length; i++) {
                var pair = event.pairs[i], headBody = null, otherBody = null;
                if (pair.bodyA.label === 'head') { headBody = pair.bodyA; otherBody = pair.bodyB; }
                else if (pair.bodyB.label === 'head') { headBody = pair.bodyB; otherBody = pair.bodyA; }
                if (!headBody || !otherBody) continue;
                var speed = Math.sqrt(headBody.velocity.x*headBody.velocity.x + headBody.velocity.y*headBody.velocity.y);
                if (otherBody.label === 'weapon') { if (otherBody.reward > 0 && speed > 3) { addCoins(otherBody.reward); showHurt(); } }
                else if (speed > 4) { addCoins(2); showHurt(); }
            }
        });

        // Тап по голове
        canvas.addEventListener('click', function(e) {
            if (ultActive && equippedWeapon === 'shuriken') {
                addCoins(260); showHurt();
                Body.setVelocity(head, { x:(Math.random()-0.5)*8, y:-6 });
                return;
            }
            var dx = head.position.x - e.clientX, dy = head.position.y - e.clientY;
            if (Math.sqrt(dx*dx+dy*dy) < RADIUS+40) {
                Body.setVelocity(head, { x:head.velocity.x+(Math.random()-0.5)*2, y:-8 });
                addCoins(1); showHurt();
            }
        });

        // Ограничения
        setInterval(() => {
            var spd = Math.sqrt(head.velocity.x*head.velocity.x + head.velocity.y*head.velocity.y);
            if (spd > 25) Body.setVelocity(head, { x:(head.velocity.x/spd)*25, y:(head.velocity.y/spd)*25 });
            if (head.position.x < RADIUS) Body.setPosition(head, { x:RADIUS, y:head.position.y });
            if (head.position.x > W-RADIUS) Body.setPosition(head, { x:W-RADIUS, y:head.position.y });
            if (head.position.y < RADIUS) Body.setPosition(head, { x:head.position.x, y:RADIUS });
            if (head.position.y > H-RADIUS) Body.setPosition(head, { x:head.position.x, y:H-RADIUS });

            // Оружие тоже не должно улетать
            Composite.allBodies(world).forEach(b => {
                if (b.label === 'weapon') {
                    if (b.position.x < -50 || b.position.x > W+50 || b.position.y > H+50) {
                        World.remove(world, b);
                        weaponSpawned[b.weaponKey] = false;
                    }
                }
            });
        }, 16);

        // Магазин
        function canBuy(wKey) {
            var w = weaponData[wKey];
            if (purchases[wKey] || coins < w.cost) return false;
            if (w.isUnlock) return blockedBranch !== null && !unlockedLost;
            if (w.requires && !purchases[w.requires]) return false;
            if (w.branch && blockedBranch && w.branch !== blockedBranch && !unlockedLost) return false;
            return true;
        }

        function buyWeapon(wKey) {
            if (!canBuy(wKey)) return;
            var w = weaponData[wKey]; coins -= w.cost; purchases[wKey] = true;
            if (w.isUnlock) unlockedLost = true;
            else if (w.branch) blockedBranch = w.branch;
            $('coins-display').textContent = '💰 ' + coins;
            saveGame(); renderInventory(); renderShop();
        }

        function renderShop() {
            var container = $('shop-items'); container.innerHTML = '';
            ['bat','sword','bita','shocker','acid','shuriken','laser_sword','unlock'].forEach(function(key) {
                var w = weaponData[key], item = document.createElement('div'); item.className = 'shop-item';
                var locked = false;
                if (w.requires && !purchases[w.requires]) locked = true;
                if (w.branch && blockedBranch && w.branch !== blockedBranch && !unlockedLost) locked = true;
                if (w.isUnlock && (!blockedBranch || unlockedLost)) locked = true;
                if (purchases[key]) locked = true;
                if (locked && !purchases[key]) item.classList.add('locked');
                if (weaponImgs[key]) { var icon = document.createElement('img'); icon.src = weaponImgs[key].src; item.appendChild(icon); }
                else if (w.isUnlock) { var d = document.createElement('div'); d.textContent = '🔓'; d.style.fontSize = '30px'; item.appendChild(d); }
                var info = document.createElement('div'); info.className = 'info';
                info.innerHTML = '<div class="name">'+w.name+'</div><div class="stats">'+w.cost+' монет | +'+w.reward+' за удар'+(w.ultName?' | Ульта: '+w.ultName:'')+'</div>';
                item.appendChild(info);
                var btn = document.createElement('div'); btn.className = 'btn';
                if (purchases[key]) { btn.textContent = 'Куплено'; btn.classList.add('disabled'); }
                else if (!canBuy(key)) { btn.textContent = coins < w.cost ? 'Мало денег' : 'Заблокировано'; btn.classList.add('disabled'); }
                else { btn.textContent = 'Купить'; btn.addEventListener('click', (function(k) { return function() { buyWeapon(k); }; })(key)); }
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        $('btn-shop').addEventListener('click', () => { $('shop-overlay').classList.add('open'); renderShop(); });
        $('close-shop').addEventListener('click', () => { $('shop-overlay').classList.remove('open'); });

        function drawWeapons() {
            Composite.allBodies(world).forEach(function(body) {
                if (body.label === 'weapon' && body.weaponKey && weaponImgs[body.weaponKey]) {
                    var img = weaponImgs[body.weaponKey];
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.save(); ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle);
                        ctx.drawImage(img, -30, -30, 60, 60); ctx.restore();
                    }
                }
            });
        }

        function initWorld() { W = canvas.width; H = canvas.height; createWalls(); Body.setPosition(head, { x:W/2, y:H-RADIUS-30 }); Body.setVelocity(head, { x:0, y:0 }); }
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initWorld(); }
        resize(); window.addEventListener('resize', resize);

        (function loop() {
            requestAnimationFrame(loop);
            Engine.update(engine, 1000/60);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            if (bgImg.complete && bgImg.naturalWidth > 0) ctx.drawImage(bgImg, 0, 0, W, H);

            // Кислотное облако
            if (acidCloud) {
                ctx.fillStyle = 'rgba(100,255,100,'+acidCloud.alpha+')';
                ctx.fillRect(0, 0, W, H);
            }

            var pos = head.position, angle = head.angle;
            ctx.save(); ctx.translate(pos.x, pos.y); ctx.rotate(angle);
            var face = (isHurt && faceHurt.complete && faceHurt.naturalWidth > 0) ? faceHurt : faceNormal;
            if (face.complete && face.naturalWidth > 0) ctx.drawImage(face, -RADIUS, -RADIUS, RADIUS*2, RADIUS*2);
            ctx.restore();
            drawWeapons();

            // Инфо ульты
            if (equippedWeapon && ultReady) $('ult-info').textContent = weaponData[equippedWeapon].ultName + ' готов';
            else if (!ultReady) $('ult-info').textContent = 'Перезарядка...';
            else $('ult-info').textContent = '';
        })();

        $('coins-display').textContent = '💰 ' + coins;
        renderInventory();
        updateUltButton();
    </script>
</body>
</html>
