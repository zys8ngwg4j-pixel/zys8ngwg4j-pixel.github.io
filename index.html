<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Buddy Head</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Buddy Head">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: 'Courier New', monospace;
            touch-action: manipulation; user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* На ПК скрываем курсор, на мобильных — обычный */
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
        }

        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        #hud {
            position: fixed; top: 15px; left: 15px;
            display: flex; align-items: center; gap: 8px;
            z-index: 10; pointer-events: none;
        }
        #hud img { width: 28px; height: 28px; }
        #coins-display { color: #fff; font-size: 18px; letter-spacing: 2px; }

        #btn-shop {
            position: fixed; bottom: 80px; right: 15px;
            padding: 14px 20px; background: rgba(30,30,30,0.9);
            border: 2px solid #666; color: #fff;
            font-family: 'Courier New', monospace; font-size: 14px;
            text-transform: uppercase; letter-spacing: 2px;
            z-index: 10; cursor: pointer;
            min-width: 44px; min-height: 44px;
        }

        #inventory {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
        }
        .inv-slot {
            width: 50px; height: 50px;
            background: rgba(20,20,20,0.8);
            border: 2px solid #444; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
            min-width: 44px; min-height: 44px;
        }
        .inv-slot:active { border-color: #aaa; background: rgba(40,40,40,0.9); }
        .inv-slot img { width: 40px; height: 40px; object-fit: contain; pointer-events: none; }
        .inv-slot.empty { opacity: 0.4; cursor: default; }
        .inv-slot.used { opacity: 0.5; border-color: #555; cursor: default; }

        #shop-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 100;
            display: none; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 30px 15px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        #shop-overlay.open { display: flex; }
        .shop-title { color: #fff; font-size: 20px; letter-spacing: 3px; margin-bottom: 20px; }
        .shop-close {
            position: fixed; top: 15px; right: 20px;
            color: #fff; font-size: 28px; cursor: pointer;
            z-index: 101; min-width: 44px; min-height: 44px;
        }
        .shop-close:active { color: #ccc; }

        .shop-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%; max-width: 360px; padding: 12px;
            border: 1px solid #333; border-radius: 10px;
            margin-bottom: 10px; background: rgba(20,20,20,0.8);
        }
        .shop-item img { width: 48px; height: 48px; object-fit: contain; pointer-events: none; }
        .shop-item .info { flex: 1; }
        .shop-item .name { color: #fff; font-size: 15px; letter-spacing: 1px; }
        .shop-item .stats { color: #ccc; font-size: 11px; margin-top: 2px; }
        .shop-item .btn {
            padding: 12px 16px; background: rgba(30,30,30,0.9);
            border: 1px solid #666; color: #fff;
            font-family: 'Courier New', monospace; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; white-space: nowrap;
            min-width: 44px; min-height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .shop-item .btn:active { background: rgba(255,255,255,0.15); }
        .shop-item .btn.disabled { opacity: 0.3; pointer-events: none; }
        .shop-item.locked { opacity: 0.4; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <img src="coin_icon.png" alt="💰">
        <span id="coins-display">0</span>
    </div>

    <div id="btn-shop">Магазин</div>
    <div id="inventory"></div>

    <div id="shop-overlay">
        <span class="shop-close" id="close-shop">✕</span>
        <div class="shop-title">МАГАЗИН</div>
        <div id="shop-items"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // ===== PWA SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const $ = id => document.getElementById(id);
        const canvas = $('game-canvas');
        const ctx = canvas.getContext('2d');

        const { Engine, World, Bodies, Body, Events, Mouse, MouseConstraint, Composite } = Matter;
        const engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
        const world = engine.world;

        const RADIUS = 55, WALL_SIZE = 80;
        let W, H, floor, leftWall, rightWall, ceiling;

        function createWalls() {
            if (floor) World.remove(world, floor);
            if (leftWall) World.remove(world, leftWall);
            if (rightWall) World.remove(world, rightWall);
            if (ceiling) World.remove(world, ceiling);

            floor = Bodies.rectangle(W/2, H + WALL_SIZE/2, W + WALL_SIZE*2, WALL_SIZE, {
                isStatic: true, friction: 1, restitution: 0.1, label: 'floor'
            });
            leftWall = Bodies.rectangle(-WALL_SIZE/2, H/2, WALL_SIZE, H + WALL_SIZE*2, {
                isStatic: true, friction: 1, restitution: 0.1, label: 'wall'
            });
            rightWall = Bodies.rectangle(W + WALL_SIZE/2, H/2, WALL_SIZE, H + WALL_SIZE*2, {
                isStatic: true, friction: 1, restitution: 0.1, label: 'wall'
            });
            ceiling = Bodies.rectangle(W/2, -WALL_SIZE/2, W + WALL_SIZE*2, WALL_SIZE, {
                isStatic: true, friction: 1, restitution: 0.1, label: 'ceiling'
            });
            World.add(world, [floor, leftWall, rightWall, ceiling]);
        }

        const head = Bodies.circle(0, 0, RADIUS, {
            restitution: 0.2, friction: 0.6, density: 0.004, label: 'head'
        });
        World.add(world, [head]);

        const mouse = Mouse.create(canvas);
        if (mouse.element) {
            mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
            mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);
        }
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse, constraint: { stiffness: 0.05, damping: 0.03, render: { visible: false } }
        });
        World.add(world, mouseConstraint);

        document.addEventListener('mousemove', function(e) {
            mouse.position.x = Math.max(RADIUS, Math.min(W - RADIUS, e.clientX));
            mouse.position.y = Math.max(RADIUS, Math.min(H - RADIUS - 10, e.clientY));
        });

        function loadImg(src) { var img = new Image(); img.src = src; return img; }
        const bgImg = loadImg('bg_lab.png');
        const faceNormal = loadImg('buddy_head.png');
        const faceHurt = loadImg('buddy_head_hurt.png');
        const weaponImgs = {
            bat: loadImg('weapon_bat.png'), sword: loadImg('weapon_sword.png'),
            bita: loadImg('weapon_bita.png'), shocker: loadImg('weapon_shocker.png'),
            acid: loadImg('weapon_acid.png'), shuriken: loadImg('weapon_shuriken.png'),
            laser_sword: loadImg('weapon_laser_sword.png')
        };

        const weaponData = {
            bat: { name:'Булава', cost:50, reward:20, img:'bat', requires:null, branch:null },
            sword: { name:'Меч', cost:670, reward:67, img:'sword', requires:'bat', branch:'right' },
            bita: { name:'Бита', cost:670, reward:67, img:'bita', requires:'bat', branch:'left' },
            shocker: { name:'Электрошокер', cost:1600, reward:260, img:'shocker', requires:'sword', branch:'right' },
            acid: { name:'Кислота', cost:1600, reward:260, img:'acid', requires:'sword', branch:'left' },
            shuriken: { name:'Сюрикены', cost:1600, reward:260, img:'shuriken', requires:'bita', branch:'right' },
            laser_sword: { name:'Лазерный меч', cost:1600, reward:260, img:'laser_sword', requires:'bita', branch:'left' },
            unlock: { name:'Разблокировка утерянного', cost:15000, reward:0, img:null, requires:null, branch:null, isUnlock:true }
        };

        let coins = 0, purchases = {}, usedWeapons = {}, unlockedLost = false, blockedBranch = null;
        let isHurt = false, hurtTimerId = null;

        function showHurt() {
            isHurt = true;
            if (hurtTimerId) clearTimeout(hurtTimerId);
            hurtTimerId = setTimeout(function() { isHurt = false; }, 1500);
        }
        function addCoins(amount) { coins += amount; $('coins-display').textContent = coins; }

        function renderInventory() {
            var inv = $('inventory'); inv.innerHTML = '';
            var owned = Object.keys(purchases).filter(function(k) { return purchases[k] && weaponData[k] && !weaponData[k].isUnlock; });
            for (var i = 0; i < 7; i++) {
                var slot = document.createElement('div'); slot.className = 'inv-slot';
                if (i < owned.length) {
                    var wKey = owned[i], w = weaponData[wKey];
                    var img = document.createElement('img'); img.src = weaponImgs[w.img].src; img.draggable = false;
                    slot.appendChild(img);
                    if (usedWeapons[wKey]) slot.classList.add('used');
                    else slot.addEventListener('click', (function(key) { return function(e) { e.stopPropagation(); spawnWeapon(key); }; })(wKey));
                } else slot.classList.add('empty');
                inv.appendChild(slot);
            }
        }

        function spawnWeapon(wKey) {
            if (usedWeapons[wKey]) return;
            usedWeapons[wKey] = true; renderInventory();
            World.add(world, [Bodies.rectangle(W/2+(Math.random()-0.5)*100, 60, 60, 60, {
                restitution:0.3, friction:0.4, density:0.003, label:'weapon', weaponKey:wKey, reward:weaponData[wKey].reward
            })]);
        }

        Events.on(engine, 'collisionStart', function(event) {
            for (var i = 0; i < event.pairs.length; i++) {
                var pair = event.pairs[i], headBody = null, otherBody = null;
                if (pair.bodyA.label === 'head') { headBody = pair.bodyA; otherBody = pair.bodyB; }
                else if (pair.bodyB.label === 'head') { headBody = pair.bodyB; otherBody = pair.bodyA; }
                if (!headBody || !otherBody) continue;
                var speed = Math.sqrt(headBody.velocity.x*headBody.velocity.x + headBody.velocity.y*headBody.velocity.y);
                if (otherBody.label === 'weapon') { if (otherBody.reward > 0 && speed > 3) { addCoins(otherBody.reward); showHurt(); } }
                else if (speed > 4) { addCoins(2); showHurt(); }
            }
        });

        canvas.addEventListener('click', function(e) {
            var dx = head.position.x - e.clientX, dy = head.position.y - e.clientY;
            if (Math.sqrt(dx*dx+dy*dy) < RADIUS+40) {
                Body.setVelocity(head, { x:head.velocity.x+(Math.random()-0.5)*2, y:-8 });
                addCoins(1); showHurt();
            }
        });

        setInterval(function() {
            var spd = Math.sqrt(head.velocity.x*head.velocity.x + head.velocity.y*head.velocity.y);
            if (spd > 25) Body.setVelocity(head, { x:(head.velocity.x/spd)*25, y:(head.velocity.y/spd)*25 });
            if (head.position.x < RADIUS) Body.setPosition(head, { x:RADIUS, y:head.position.y });
            if (head.position.x > W-RADIUS) Body.setPosition(head, { x:W-RADIUS, y:head.position.y });
            if (head.position.y < RADIUS) Body.setPosition(head, { x:head.position.x, y:RADIUS });
            if (head.position.y > H-RADIUS) Body.setPosition(head, { x:head.position.x, y:H-RADIUS });
        }, 16);

        function canBuy(wKey) {
            var w = weaponData[wKey];
            if (purchases[wKey] || coins < w.cost) return false;
            if (w.isUnlock) return blockedBranch !== null && !unlockedLost;
            if (w.requires && !purchases[w.requires]) return false;
            if (w.branch && blockedBranch && w.branch !== blockedBranch && !unlockedLost) return false;
            return true;
        }

        function buyWeapon(wKey) {
            if (!canBuy(wKey)) return;
            var w = weaponData[wKey]; coins -= w.cost; purchases[wKey] = true;
            if (w.isUnlock) unlockedLost = true;
            else if (w.branch) blockedBranch = w.branch;
            $('coins-display').textContent = coins;
            renderInventory(); renderShop();
        }

        function renderShop() {
            var container = $('shop-items'); container.innerHTML = '';
            ['bat','sword','bita','shocker','acid','shuriken','laser_sword','unlock'].forEach(function(key) {
                var w = weaponData[key], item = document.createElement('div'); item.className = 'shop-item';
                var locked = false;
                if (w.requires && !purchases[w.requires]) locked = true;
                if (w.branch && blockedBranch && w.branch !== blockedBranch && !unlockedLost) locked = true;
                if (w.isUnlock && (!blockedBranch || unlockedLost)) locked = true;
                if (purchases[key]) locked = true;
                if (locked && !purchases[key]) item.classList.add('locked');
                if (w.img && weaponImgs[w.img]) { var icon = document.createElement('img'); icon.src = weaponImgs[w.img].src; item.appendChild(icon); }
                else if (w.isUnlock) { var d = document.createElement('div'); d.textContent = '🔓'; d.style.fontSize = '30px'; item.appendChild(d); }
                var info = document.createElement('div'); info.className = 'info';
                info.innerHTML = '<div class="name">'+w.name+'</div><div class="stats">'+w.cost+' монет | +'+w.reward+' за удар</div>';
                item.appendChild(info);
                var btn = document.createElement('div'); btn.className = 'btn';
                if (purchases[key]) { btn.textContent = 'Куплено'; btn.classList.add('disabled'); }
                else if (!canBuy(key)) { btn.textContent = coins < w.cost ? 'Мало денег' : 'Заблокировано'; btn.classList.add('disabled'); }
                else { btn.textContent = 'Купить'; btn.addEventListener('click', (function(k) { return function() { buyWeapon(k); }; })(key)); }
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        $('btn-shop').addEventListener('click', function() { $('shop-overlay').classList.add('open'); renderShop(); });
        $('close-shop').addEventListener('click', function() { $('shop-overlay').classList.remove('open'); });

        function drawWeapons() {
            Composite.allBodies(world).forEach(function(body) {
                if (body.label === 'weapon' && body.weaponKey && weaponImgs[body.weaponKey]) {
                    var img = weaponImgs[body.weaponKey];
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.save(); ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle);
                        ctx.drawImage(img, -30, -30, 60, 60); ctx.restore();
                    }
                }
            });
        }

        function initWorld() { W = canvas.width; H = canvas.height; createWalls(); Body.setPosition(head, { x:W/2, y:H-RADIUS-30 }); Body.setVelocity(head, { x:0, y:0 }); }
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initWorld(); }
        resize(); window.addEventListener('resize', resize);

        (function loop() {
            requestAnimationFrame(loop);
            Engine.update(engine, 1000/60);
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
            if (bgImg.complete && bgImg.naturalWidth > 0) ctx.drawImage(bgImg, 0, 0, W, H);
            var pos = head.position, angle = head.angle;
            ctx.save(); ctx.translate(pos.x, pos.y); ctx.rotate(angle);
            var face = (isHurt && faceHurt.complete && faceHurt.naturalWidth > 0) ? faceHurt : faceNormal;
            if (face.complete && face.naturalWidth > 0) ctx.drawImage(face, -RADIUS, -RADIUS, RADIUS*2, RADIUS*2);
            ctx.restore();
            drawWeapons();
        })();

        $('coins-display').textContent = '0';
        renderInventory();
    </script>
</body>
</html>
